name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-glib-2.0 python3-pytest libxkbcommon0 xkb-data
      - name: Run tests
        run: python3 -m pytest -v
